name: Actual project templates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: true
env:
  MCPP_VERSION: "2026.11.18.1"
  # See ci.yml: compat.openssl 3.5.9 from mcpp-index#845 until it is published.
  MCPP_INDEX_CANDIDATE: "7359195426993b43217bd07d02454e61c15abf31"
jobs:
  templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned mcpp
        shell: bash
        run: |
          archive="mcpp-${MCPP_VERSION}-linux-x86_64.tar.gz"
          curl -L -fsS -o "$archive" "https://github.com/mcpp-community/mcpp/releases/download/v${MCPP_VERSION}/$archive"
          tar -xzf "$archive"
          echo "$PWD/mcpp-${MCPP_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Candidate index (mcpp-index#845)
        run: |
          git init -q "$RUNNER_TEMP/index"
          git -C "$RUNNER_TEMP/index" fetch -q --depth 1 https://github.com/mcpplibs/mcpp-index "$MCPP_INDEX_CANDIDATE"
          git -C "$RUNNER_TEMP/index" checkout -q FETCH_HEAD
      - name: Actual scaffold, strict build and run of the default template (digest)
        run: python3 tools/test_template.py --toolchain gcc@16.1.0 --index "$RUNNER_TEMP/index"
      - name: Actual scaffold, strict build and run of the tls-loopback template
        run: python3 tools/test_template.py --toolchain gcc@16.1.0 --index "$RUNNER_TEMP/index" --template tls-loopback
